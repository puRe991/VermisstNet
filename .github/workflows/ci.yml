name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vermisst
          POSTGRES_PASSWORD: vermisst
          POSTGRES_DB: vermisstatlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vermisst" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vermisst:vermisst@localhost:5432/vermisstatlas_test?schema=public
      DATABASE_URL: postgresql://vermisst:vermisst@localhost:5432/vermisstatlas_test?schema=public
      DATA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      IP_HASH_SECRET: ci-ip-hash-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
